services:
  mysql:
    image: mysql:8.0
    container_name: livros-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: livrosdb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mysql-data:
